version: "3.9"

services:
  ros2-vnc:
    build:
      context: .
      dockerfile: Dockerfile
      platforms: 
       - linux/amd64
    container_name: ros2-vnc
    hostname: docker-desktop
    ports:
      - "5901:5901"
    environment:
      - VNC_PASSWORD=ros          # change your VNC password here if needed
      - DISPLAY=:1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=50
    volumes:
      - ../..:/home/user/Eurobot-2026-Navigation-ws  # TODO: adjust to your workspace path
    working_dir: /home/user/Eurobot-2026-Navigation-ws
    stdin_open: true
    tty: true
    command: /bin/bash

# ros2 launch navigation2_run sim_launch.py
# ros2 run object_layer ObjectSim
# ros2 run rival_layer RivalSim